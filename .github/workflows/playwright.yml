name: ParaBank Playwright Python

on:
  push:
  pull_request:

concurrency:
  group: parabank-public-sandbox
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run assignment test suite
        run: >
          pytest
          tests/test_currency.py
          tests/test_api_smoke.py
          tests/test_registration.py
          tests/test_open_account.py
          tests/test_scenario_a.py
          tests/test_scenario_b.py
          tests/test_scenario_c.py
          -v -s

      - name: Upload custom HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parabank-custom-report
          path: reports/
          if-no-files-found: warn